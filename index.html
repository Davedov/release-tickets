<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<h1>Test tickets analysis</h1>
		</header>
		<main>
			<section id="main-info" class="main-info">
				<article id="tickets" class="tickets">
					<h2>tickets</h2>
					<div>
						<p>Filter by classification:</p>
						<ul id="classification-filters" class="classification-filters">
							<li><button data-classification="all" class="selected">All</button></li>
							<li><button data-classification="active">Active</button></li>
							<li><button data-classification="done">Done</button></li>
							<li><button data-classification="unassigned">Unassigned</button></li>
							<li><button data-classification="priority">Priority</button></li>
							<li><button data-classification="release_blocker">Release Blocker</button></li>
						</ul>
						<label for="search-bar">
							Search:
							<input type="text" id="search-bar" placeholder="Search by title" />
						</label>
					</div>
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>Title</th>
								<th>Severity</th>
								<th>Status</th>
								<th>Owner</th>
								<th>Remaining Hours</th>
								<th>customerVip</th>
								<th>Blocked</th>
								<th>classification</th>
							</tr>
						</thead>
						<tbody id="tickets-list"></tbody>
					</table>
					<div>
						<p id="no-tickets-message" class="warning hidden no-tickets-message">
							No tickets found
						</p>
					</div>
				</article>
				<article id="release-analysis">
					<h2>Release Analysis</h2>
					<ul id="release-analysis-list" class="release-analysis-list"></ul>
					<div id="release-decision" class="release-decision"></div>
				</article>
			</section>
			<section>
				<h2>Add New Ticket</h2>
				<form id="new-ticket-form">
					<fieldset>
						<legend>Ticket Details</legend>
						<label for="new-ticket-title">
							Title:
							<input type="text" id="new-ticket-title" name="title" placeholder="Title" />
						</label>
						<label for="new-ticket-severity">
							Severity:
							<input
								type="number"
								id="new-ticket-severity"
								name="severity"
								placeholder="Severity"
							/>
						</label>
						<label for="new-ticket-status">
							Status:
							<select name="status" id="new-ticket-status">
								<option value="" disabled selected>-Select Status-</option>
								<option value="open">Open</option>
								<option value="done">Done</option>
								<option value="testing">Testing</option>
							</select>
						</label>
						<label for="new-ticket-owner">
							Owner:
							<input type="text" id="new-ticket-owner" name="owner" placeholder="Owner" />
						</label>
						<label for="new-ticket-remaining-hours">
							Remaining Hours:
							<input
								type="number"
								id="new-ticket-remaining-hours"
								name="remaining-hours"
								placeholder="Estimated Remaining Hours"
							/>
						</label>
						<label for="new-ticket-customer-vip">
							Customer VIP
							<input type="checkbox" id="new-ticket-customer-vip" name="customer-vip" />
						</label>
						<label for="new-ticket-blocked">
							Blocked
							<input type="checkbox" id="new-ticket-blocked" name="blocked" />
						</label>
						<button type="submit">Add Ticket</button>
					</fieldset>
				</form>
			</section>
		</main>
		<footer>
			<p>&copy; 2026 Test tickets analysis. All rights reserved.</p>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
