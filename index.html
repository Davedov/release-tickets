			<section id="main-info" class="main-info">

					<h2>tickets</h2>
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>Title</th>
								<th>Severity</th>
								<th>Status</th>
								<th>Owner</th>
								<th>Remaining Hours</th>
								<th>customerVip</th>
								<th>Blocked</th>
							</tr>
						</thead>
						<tbody id="tickets-list"></tbody>
					</table>
				</article>
				<article id="release-analysis">
					<h2>Release Analysis</h2>
					<ul id="release-analysis-list"></ul>
					<div id="release-decidsion"></div>
