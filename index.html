<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<h1>Test tickets analysis</h1>
		</header>
		<main>
			<section id="main-info" class="main-info">
				<article id="tickets" class="tickets">
					<h2>tickets</h2>
					<div>
						<p>Filter by classification:</p>
						<ul id="classification-filters" class="classification-filters">
							<li><button data-classification="all" class="selected">All</button></li>
							<li><button data-classification="active">Active</button></li>
							<li><button data-classification="done">Done</button></li>
							<li><button data-classification="unassigned">Unassigned</button></li>
							<li><button data-classification="priority">Priority</button></li>
							<li><button data-classification="release_blocker">Release Blocker</button></li>
						</ul>
						<label for="search-bar">
							Search:
							<input type="text" id="search-bar" placeholder="Search by title" />
						</label>
					</div>
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>Title</th>
								<th>Severity</th>
								<th>Status</th>
								<th>Owner</th>
								<th>Remaining Hours</th>
								<th>customerVip</th>
								<th>Blocked</th>
								<th>classification</th>
							</tr>
						</thead>
						<tbody id="tickets-list"></tbody>
					</table>
					<div>
						<p id="no-tickets-message" class="warning hidden no-tickets-message">
							No tickets found
						</p>
					</div>
				</article>
				<article id="release-analysis">
					<h2>Release Analysis</h2>
					<ul id="release-analysis-list" class="release-analysis-list"></ul>
					<div id="release-decision" class="release-decision"></div>
				</article>
			</section>
		</main>
		<footer>
			<p>&copy; 2026 Test tickets analysis. All rights reserved.</p>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
